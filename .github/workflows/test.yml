name: tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_real_stores:
        description: Run disposable real Chroma/Neo4j integration (not identity/model acceptance)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          version="8.30.1"
          archive="gitleaks_${version}_linux_x64.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/$archive" \
            | sha256sum --check --strict
          tar --extract --gzip --file "$RUNNER_TEMP/$archive" \
            --directory "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
      - name: Scan checked-out files
        shell: bash
        run: >-
          "$RUNNER_TEMP/gitleaks" dir . --no-banner --redact
          --max-archive-depth 1 --exit-code 1
      - name: Scan complete Git history
        shell: bash
        run: >-
          "$RUNNER_TEMP/gitleaks" git . --no-banner --redact
          --max-archive-depth 1 --exit-code 1

  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependency
        run: python -m pip install --constraint constraints/core-py313.txt --constraint constraints/linux-py313.txt ".[test]" setuptools==80.9.0 wheel==0.45.1
      - name: Check constrained environment
        run: python -m pip check
      - name: Verify CLI help has no service dependency
        run: graphmind --help
      - name: Run offline tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B -m unittest discover -s tests -v
      - name: Verify executable browser-script test prerequisite
        run: node --version
      - name: Build and verify installed artifact outside checkout
        run: python tools/verify_package.py

  real-stores:
    if: github.event_name == 'workflow_dispatch' && inputs.run_real_stores
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:2026.04.0
        env:
          NEO4J_AUTH: none
        ports:
          - 127.0.0.1:7687:7687
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --constraint constraints/core-py313.txt --constraint constraints/linux-py313.txt ".[test]"
      - name: Test real stores with disposable fixtures
        env:
          GRAPHMIND_RUN_INTEGRATION: "1"
          NEO4J_URI: bolt://127.0.0.1:7687
          NEO4J_PASSWORD: disposable-ci-no-auth
        run: python tools/run_real_acceptance.py --stores
