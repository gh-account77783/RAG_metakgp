[graphmind]
data_dir = ".graphmind-data"
allowed_import_roots = ["."]
collection_id = "default"
collection_name = "graphmind_chunks"
max_file_bytes = 26214400
chunk_size = 1200
chunk_overlap = 120
embedding_provider = "ollama"
embedding_model = "bge-m3"
embedding_model_id = "BAAI/bge-m3"
embedding_revision = "auto"
embedding_precision = "auto"
embedding_base_url = "http://127.0.0.1:11434"
embedding_dimension = 1024
embedding_timeout_seconds = 60
embedding_batch_size = 16
job_lease_seconds = 60
max_queued_jobs = 100
max_extracted_chars = 10000000
max_archive_entries = 2048
max_archive_uncompressed_bytes = 104857600
max_pdf_pages = 1000
parser_timeout_seconds = 30
csv_delimiter = "auto"
answer_provider = "ollama"
answer_mode = "local"
answer_model = "gemma4:e2b"
ollama_base_url = "http://127.0.0.1:11434"
answer_timeout_seconds = 120
answer_max_retries = 1
answer_max_context_chars = 24000
answer_max_output_tokens = 512
retrieval_seed_limit = 4
retrieval_graph_limit = 8
retrieval_graph_scope = "chunk"
retrieval_max_evidence = 12
retrieval_min_vector_score = 0.02
max_question_chars = 2000
max_concurrent_queries = 2
max_queued_queries = 4
query_queue_timeout_seconds = 1.0
