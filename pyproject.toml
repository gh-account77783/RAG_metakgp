[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "graphmind-rag-mcp"
version = "0.1.0"
description = "Self-hosted document RAG foundation with vector and document-graph retrieval"
readme = { file = "README", content-type = "text/markdown" }
requires-python = ">=3.11"
dependencies = [
  "chromadb==1.5.9",
  "neo4j==6.3.0",
  "pypdf==6.18.0",
]

[project.optional-dependencies]
test = ["build==1.6.0"]

[project.scripts]
graphmind = "graphmind.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["graphmind*"]
