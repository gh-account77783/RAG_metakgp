[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "graphmind-rag-mcp"
version = "0.1.0"
description = "Self-hosted document RAG foundation with vector and document-graph retrieval"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.13,<3.14"
dependencies = [
  "certifi==2026.10.19",
  "chromadb==1.5.9",
  "mcp==2.0.1",
  "neo4j==6.3.0",
  "PyJWT==2.15.1",
  "pypdf==6.18.0",
  "starlette==1.6.0",
  "uvicorn==0.53.0",
]

[project.optional-dependencies]
windows-service = ["pywin32==312; sys_platform == 'win32'"]
test = ["build==1.6.0", "pageindex==0.4.4", "pillow==13.0.0"]
tree = ["pageindex==0.4.4", "pillow==13.0.0"]
rerank = ["sentence-transformers==6.1.0", "torch==2.14.1"]
visual = [
  "sentence-transformers==6.1.0",
  "torch==2.14.1",
  "torchvision==0.29.1",
  "transformers[vision]==5.20.2",
  "pypdfium2==5.14.0",
]

[project.scripts]
graphmind = "graphmind.cli:main"

[tool.setuptools]
# The tools mapping lets setuptools resolve the build-only command outside src.
# Package discovery below still includes only graphmind*, never tools.
package-dir = { "" = "src", "tools" = "tools" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["graphmind*"]

[tool.setuptools.cmdclass]
build_py = "tools.build_assets.BuildPy"

[tool.setuptools.data-files]
"share/graphmind/documentation" = ["documentation/AUTH_AND_MCP.md", "documentation/DEPENDENCIES.md", "documentation/ARCHITECTURE.md", "documentation/RELEASE_BUNDLES.md"]
"share/graphmind/config" = ["config/graphmind.example.toml", "config/.env.example"]
"share/graphmind/config/constraints" = ["config/constraints/core-py313.txt", "config/constraints/linux-py313.txt", "config/constraints/engines-py313.txt"]
"share/graphmind/config/artifacts" = ["config/artifacts/cpu-torch-cp313.json"]
"share/graphmind/deploy/keycloak" = ["deploy/keycloak/README.md", "deploy/keycloak/graphmind-realm.template.json", "deploy/keycloak/graphmind-user-profile.json", "deploy/keycloak/graphmind-recovery.json", "deploy/keycloak/nginx-recovery.conf.example"]
"share/graphmind/deploy/keycloak/recovery-src/org/graphmind/keycloak" = ["deploy/keycloak/recovery-src/org/graphmind/keycloak/ExistingPasswordResetFactory.java", "deploy/keycloak/recovery-src/org/graphmind/keycloak/PasswordRevocationFactory.java"]
"share/graphmind/deploy/keycloak/recovery-src/META-INF/services" = ["deploy/keycloak/recovery-src/META-INF/services/org.keycloak.authentication.AuthenticatorFactory", "deploy/keycloak/recovery-src/META-INF/services/org.keycloak.events.EventListenerProviderFactory"]
"share/graphmind/deploy/keycloak/themes/graphmind/email" = ["deploy/keycloak/themes/graphmind/email/theme.properties"]
"share/graphmind/deploy/keycloak/themes/graphmind/email/messages" = ["deploy/keycloak/themes/graphmind/email/messages/messages_en.properties"]
"share/graphmind/deploy/acceptance" = ["deploy/acceptance/README.md"]
"share/graphmind/deploy/native" = ["deploy/native/README.md", "deploy/native/ubuntu.example.json", "deploy/native/ubuntu.backends.example.json", "deploy/native/windows.example.json"]
"share/graphmind/deploy/docker" = ["deploy/docker/Dockerfile", "deploy/docker/compose.yaml", "deploy/docker/Caddyfile", "deploy/docker/runtime.py", "deploy/docker/bootstrap_identity.py", "deploy/docker/healthcheck.py", "deploy/docker/keycloak-start.sh", "deploy/docker/profile.example.json", "deploy/docker/smtp.example.json", "deploy/docker/README.md", "deploy/docker/.dockerignore", "deploy/docker/.gitignore", "deploy/docker/.gitattributes"]
"share/graphmind/tools" = ["tools/run_real_acceptance.py", "tools/mcp_acceptance.py", "tools/build_keycloak_recovery.py", "tools/ubuntu_service_files.py", "tools/ubuntu_backend_files.py", "tools/ubuntu_release_files.py", "tools/ubuntu_installation.py", "tools/ubuntu_configuration.py", "tools/UBUNTU_INSTALLATION.md", "tools/windows_service_files.py", "tools/windows_service_host.py", "tools/windows_installation.py", "tools/windows_operations.py", "tools/WINDOWS_INSTALLATION.md", "tools/WINDOWS_OPERATIONS.md", "tools/docker_configuration.py", "tools/identity_configuration.py", "tools/bundle_installer.py"]
